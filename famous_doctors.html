<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中医药材图鉴 - 名医介绍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            background: #f5f6fa;
            color: #2c3e50;
        }

        .hero {
            background: linear-gradient(135deg, #1abc9c, #2ecc71);
            color: white;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 20px;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .doctor-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .doctor-card:hover {
            transform: translateY(-5px);
        }

        .doctor-image {
            width: 100%;
            height: 250px;
            background: #eee;
            overflow: hidden;
        }

        .doctor-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .doctor-card:hover .doctor-image img {
            transform: scale(1.05);
        }

        .doctor-info {
            padding: 20px;
        }

        .doctor-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .doctor-title {
            color: #27ae60;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .doctor-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .contact-btn {
            display: inline-block;
            padding: 8px 20px;
            background: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .contact-btn:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>
    <div class="hero">
        <a href="index.html" class="back-btn">← 返回首页</a>
        <h1>名医介绍</h1>
        <p>汇集各领域中医专家，提供专业诊疗服务</p>
    </div>

    <div class="container">
        <div class="doctors-grid">
            <div class="doctor-card">
                <div class="doctor-image">
                    <img src="images/doctors/doctor1.jpg" alt="郭主任医生">
                </div>
                <div class="doctor-info">
                    <h3 class="doctor-name">郭主任</h3>
                    <div class="doctor-title">主任医师 | 中医内科</div>
                    <p class="doctor-description">从医30余年，擅长治疗各种内科疾病，尤其在消化系统疾病和呼吸系统疾病方面有独特见解。</p>
                    <a href="#" class="contact-btn">预约咨询</a>
                </div>
            </div>

            <div class="doctor-card">
                <div class="doctor-image">
                    <img src="images/doctors/doctor2.jpg" alt="郭副主任医生">
                </div>
                <div class="doctor-info">
                    <h3 class="doctor-name">郭副主任</h3>
                    <div class="doctor-title">副主任医师 | 针灸推拿</div>
                    <p class="doctor-description">专注针灸推拿20年，对颈椎病、腰椎病、关节炎等疾病有丰富的临床经验。</p>
                    <a href="#" class="contact-btn">预约咨询</a>
                </div>
            </div>

            <div class="doctor-card">
                <div class="doctor-image">
                    <img src="images/doctors/doctor3.jpg" alt="Kaylee主任医生">
                </div>
                <div class="doctor-info">
                    <h3 class="doctor-name">Kaylee主任</h3>
                    <div class="doctor-title">主任医师 | 妇科</div>
                    <p class="doctor-description">专注中医妇科疾病治疗，对月经不调、不孕症、更年期综合征等疾病有独到见解。</p>
                    <a href="#" class="contact-btn">预约咨询</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
