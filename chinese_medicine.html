<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中医药材图鉴 - 药材检索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            min-height: 100vh;
            color: #2c3e50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: linear-gradient(135deg, #fff, #f8f9fa);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
        }

        .hero h1 {
            font-size: 2em;
            margin-bottom: 15px;
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .hero p {
            font-size: 1em;
            color: #666;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 8px 16px;
            background: #f8f9fa;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2c3e50;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9em;
        }

        .back-btn:hover {
            background: #3498db;
            color: white;
        }

        .search-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52,152,219,0.2);
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .category-btn {
            padding: 8px 16px;
            background: #f8f9fa;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2c3e50;
            font-size: 0.9em;
        }

        .category-btn:hover, .category-btn.active {
            background: #3498db;
            color: white;
        }

        .property-filters {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .property-filters select {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            font-size: 0.9em;
            flex: 1;
        }

        .medicine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .medicine-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .medicine-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .card-image {
            height: 160px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow: hidden;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
        }

        .card-image svg {
            width: 100%;
            height: 100%;
            display: block;
            padding: 16px;
        }

        .card-content {
            padding: 15px;
        }

        .card-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .card-category {
            font-size: 0.9em;
            color: #666;
            background: #f8f9fa;
            padding: 4px 8px;
            border-radius: 10px;
        }

        .card-properties {
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .card-effects {
            font-size: 0.9em;
            color: #2c3e50;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal-content {
            position: relative;
            background: white;
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .modal-content p {
            margin-bottom: 15px;
            line-height: 1.6;
            color: #666;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            color: #3498db;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            background: white;
            margin-top: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 1.8em;
            }

            .hero p {
                font-size: 0.9em;
            }

            .property-filters {
                flex-direction: column;
                gap: 10px;
            }

            .medicine-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            .modal-content {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="hero">
            <a href="index.html" class="back-btn">← 返回首页</a>
            <h1>中医药材图鉴</h1>
            <p>在这里，您可以快速检索和了解各种中药材的详细信息。</p>
        </section>

        <section class="search-section">
            <input type="text" class="search-box" placeholder="搜索药材名称、拼音、功效...">
            <div class="category-buttons">
                <button class="category-btn active" data-category="全部">全部</button>
                <button class="category-btn" data-category="补气类">补气类</button>
                <button class="category-btn" data-category="补血类">补血类</button>
                <button class="category-btn" data-category="清热类">清热类</button>
                <button class="category-btn" data-category="理气类">理气类</button>
                <button class="category-btn" data-category="安神类">安神类</button>
                <button class="category-btn" data-category="活血类">活血类</button>
                <button class="category-btn" data-category="利水类">利水类</button>
                <button class="category-btn" data-category="发散类">发散类</button>
                <button class="category-btn" data-category="化痰类">化痰类</button>
                <button class="category-btn" data-category="平肝类">平肝类</button>
                <button class="category-btn" data-category="养阴类">养阴类</button>
                <button class="category-btn" data-category="收涩类">收涩类</button>
                <button class="category-btn" data-category="补阳类">补阳类</button>
                <button class="category-btn" data-category="解表类">解表类</button>
            </div>
            <div class="property-filters">
                <select id="nature-filter">
                    <option value="">性质筛选</option>
                    <option value="温">温</option>
                    <option value="热">热</option>
                    <option value="平">平</option>
                    <option value="凉">凉</option>
                    <option value="寒">寒</option>
                </select>
                <select id="taste-filter">
                    <option value="">味道筛选</option>
                    <option value="甘">甘</option>
                    <option value="苦">苦</option>
                    <option value="辛">辛</option>
                    <option value="酸">酸</option>
                    <option value="咸">咸</option>
                </select>
            </div>
        </section>

        <div class="medicine-grid" id="medicine-grid">
            <!-- 药材卡片将通过 JavaScript 动态生成 -->
        </div>

        <div class="modal" id="detail-modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <div id="modal-detail">
                    <!-- 详细信息将通过 JavaScript 动态生成 -->
                </div>
            </div>
        </div>

        <footer>
            <p>中医药材图鉴 © 2024 - 传承千年中医智慧</p>
        </footer>
    </div>

    <script src="medicine_data.js"></script>
    <script>
        // 获取DOM元素
        const searchBox = document.querySelector('.search-box');
        const categoryButtons = document.querySelectorAll('.category-btn');
        const natureFilter = document.getElementById('nature-filter');
        const tasteFilter = document.getElementById('taste-filter');
        const medicineGrid = document.getElementById('medicine-grid');
        const modal = document.getElementById('detail-modal');
        const modalDetail = document.getElementById('modal-detail');
        const closeBtn = document.querySelector('.close-btn');

        // 当前筛选状态
        let currentCategory = '全部';
        let currentNature = '';
        let currentTaste = '';
        let searchTerm = '';

        // 渲染药材卡片
        function renderMedicineCards() {
            medicineGrid.innerHTML = '';
            
            Object.entries(medicineData).forEach(([name, info]) => {
                // 应用筛选条件
                if (currentCategory !== '全部' && info.category !== currentCategory) return;
                if (currentNature && !info.properties?.nature?.includes(currentNature)) return;
                if (currentTaste && !info.properties?.taste?.includes(currentTaste)) return;
                if (searchTerm && !matchesSearch(name, info, searchTerm)) return;

                const card = document.createElement('div');
                card.className = 'medicine-card';
                
                // 生成SVG内容
                const svgContent = generateSvg(name, info.category);
                
                card.innerHTML = `
                    <div class="card-image">
                        ${svgContent}
                    </div>
                    <div class="card-content">
                        <div class="card-header">
                            <span class="card-category">${info.category}</span>
                        </div>
                        <div class="card-properties">
                            性味：${info.properties?.nature || ''}，${info.properties?.taste || ''}
                        </div>
                        <div class="card-effects">
                            功效：${(info.effects || []).slice(0, 2).join('，')}
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => showDetail(name, info));
                medicineGrid.appendChild(card);
            });
        }

        // 生成SVG内容
        function generateSvg(name, category) {
            const colors = {
                '补气类': '#FFE4B5',
                '补血类': '#FFB6C1',
                '清热类': '#E0FFFF',
                '理气类': '#F0FFF0',
                '安神类': '#E6E6FA',
                '活血类': '#FFC0CB',
                '利水类': '#B0E0E6',
                '发散类': '#F5F5DC',
                '化痰类': '#F0F8FF',
                '平肝类': '#98FB98',
                '养阴类': '#E6E6FA',
                '收涩类': '#DEB887',
                '补阳类': '#FFE4C4',
                '解表类': '#F0FFFF'
            };
            const bgColor = colors[category] || '#F5F5F5';
            
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" preserveAspectRatio="xMidYMid meet">
                <rect width="300" height="160" fill="${bgColor}"/>
                <text x="150" y="70" text-anchor="middle" font-size="36" fill="#333" font-family="Microsoft YaHei">${name}</text>
                <text x="150" y="110" text-anchor="middle" font-size="20" fill="#666" font-family="Microsoft YaHei">${category}</text>
            </svg>`;
        }

        // 显示详细信息
        function showDetail(name, info) {
            modalDetail.innerHTML = `
                <h2>${name}</h2>
                <p>拼音：${info.pinyin || ''}</p>
                <p>分类：${info.category || ''}</p>
                <p>性味：${info.properties?.nature || ''}，${info.properties?.taste || ''}</p>
                <p>归经：${info.properties?.meridian || ''}</p>
                <p>功效：${(info.effects || []).join('，')}</p>
                <p>用法用量：${info.usage || ''}</p>
                <p>禁忌：${info.contraindications || ''}</p>
            `;
            modal.style.display = 'block';
        }

        // 搜索匹配函数
        function matchesSearch(name, info, term) {
            term = term.toLowerCase();
            return name.toLowerCase().includes(term) ||
                (info.pinyin || '').toLowerCase().includes(term) ||
                (info.effects || []).some(effect => effect.toLowerCase().includes(term)) ||
                (info.properties?.nature || '').toLowerCase().includes(term) ||
                (info.properties?.taste || '').toLowerCase().includes(term);
        }

        // 事件监听器
        searchBox.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderMedicineCards();
        });

        categoryButtons.forEach(button => {
            button.addEventListener('click', () => {
                categoryButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                currentCategory = button.dataset.category;
                renderMedicineCards();
            });
        });

        natureFilter.addEventListener('change', (e) => {
            currentNature = e.target.value;
            renderMedicineCards();
        });

        tasteFilter.addEventListener('change', (e) => {
            currentTaste = e.target.value;
            renderMedicineCards();
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        // 初始渲染
        renderMedicineCards();
    </script>
</body>
</html>
